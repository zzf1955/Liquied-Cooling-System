name: Tests

on:
  push:
    branches: [ main, dev, fix/**, test/** ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install: |
        uv sync dependencies
      run

    - name: Run pytest
      run: |
        uv run pytest test/test_battery.py -v --tb=short

    - name: Run vectorized thermal tests
      run: |
        uv run pytest test/test_vectorized_thermal.py -v --tb=short

    - name: Run multi-battery compat tests
      run: |
        uv run pytest test/test_multi_battery_compat.py -v --tb=short
